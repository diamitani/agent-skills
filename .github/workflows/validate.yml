name: Validate and build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Build platform dist/
        run: python3 scripts/build.py
      - name: Commit dist/ and index.json on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json dist
          if git diff --staged --quiet; then
            echo "No dist/index changes to commit"
          else
            git commit -m "chore: refresh dist/ and index.json [skip ci]"
            git push
          fi
      - name: Fail PR if dist/ or index.json are stale
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/validate.py
          python3 scripts/build.py
          git add index.json dist
          if ! git diff --staged --quiet; then
            echo "dist/ or index.json out of date; run validate.py + build.py and commit" >&2
            git --no-pager diff --staged --stat
            exit 1
          fi
